name: Nightly backup

# Dumps the whole Postgres database every night and keeps a copy in
# three places (whichever are configured):
#
#   1. GitHub Release `backup-archive` — permanent, never expires
#   2. Cloudflare R2 bucket          — only when R2_* secrets exist
#   3. Run summary + size check     — so a silent failure is visible
#
# Every backup file carries its date: anjuman-YYYYMMDD-HHMM.sql.gz[.gpg]
#
# Required secret:
#   SUPABASE_DB_URL = postgresql://postgres:<password>@db.<ref>.supabase.co:5432/postgres
# Optional secrets:
#   BACKUP_PASSPHRASE  = encrypt the dump (AES-256) before upload
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET
#
# Restore: see BACKUP.md

on:
  schedule:
    - cron: "0 21 * * *" # 02:30 IST
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backup.yml"

permissions:
  contents: write

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check for database URL secret
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not set — skipping backup. Add it in repo Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgres client
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # Supabase runs PostgreSQL 17; Ubuntu's default client is 16 and
          # pg_dump refuses to dump a newer server. Install the matching
          # client from the PGDG repository and put it first on PATH.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Resolve IPv4 pooler connection
        if: steps.check.outputs.ready == 'true'
        env:
          RAW_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          URL="$RAW_DB_URL"
          # Supabase free projects only publish an IPv6 address for the
          # direct database host, and GitHub runners have no IPv6 route.
          # The session pooler has IPv4 and supports pg_dump.
          if [[ "$URL" =~ ^postgresql://postgres:(.*)@db\.([a-z0-9]+)\.supabase\.co:5432/postgres$ ]]; then
            PASS="${BASH_REMATCH[1]}"
            REF="${BASH_REMATCH[2]}"
            if [[ "$PASS" != *"%"* ]]; then
              PASS=$(printf '%s' "$PASS" | sed -e 's/%/%25/g' -e 's/@/%40/g' -e 's/:/%3A/g' -e 's/#/%23/g' -e 's|/|%2F|g')
            fi
            URL="postgresql://postgres.${REF}:${PASS}@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require"
          fi
          echo "DB_URL_DUMP=$URL" >> "$GITHUB_ENV"
          echo "Using host: $(printf '%s' "$URL" | sed -E 's#.*@([^/?]+).*#\1#')"

      - name: Dump database
        if: steps.check.outputs.ready == 'true'
        run: |
          set -uo pipefail
          STAMP=$(date -u +%Y/%m/%d)
          FILE="anjuman-$(date -u +%Y%m%d-%H%M).sql.gz"
          if ! pg_dump "$DB_URL_DUMP" --no-owner --no-privileges --clean --if-exists > dump.sql 2> dump.err; then
            ERR=$(tr '\n' ' ' < dump.err | tail -c 600)
            echo "::error::pg_dump failed: $ERR"
            exit 1
          fi
          gzip -9 < dump.sql > "$FILE"
          gzip -t "$FILE" # fail loudly on a truncated dump
          SIZE=$(stat -c %s "$FILE")
          if [ "$SIZE" -lt 2000 ]; then
            echo "::error::Dump is suspiciously small ($SIZE bytes) — refusing to publish."
            exit 1
          fi
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "PREFIX=backups/$STAMP" >> "$GITHUB_ENV"
          echo "SIZE_KB=$((SIZE / 1024))" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - name: Encrypt dump (optional)
        if: steps.check.outputs.ready == 'true'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "${PASS:-}" ]; then
            echo "No BACKUP_PASSPHRASE set — artifact will be a plain .sql.gz (GitHub artifact access is repository-scoped)."
            exit 0
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASS" --output "$FILE.gpg" "$FILE"
          shred -u "$FILE"
          echo "FILE=$FILE.gpg" >> "$GITHUB_ENV"
          echo "ENCRYPTED=true" >> "$GITHUB_ENV"
          echo "::notice::Backup encrypted with BACKUP_PASSPHRASE (AES-256)"
          ls -lh "$FILE.gpg"

      - name: Upload to R2 (optional, never fails the run)
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "${R2_BUCKET:-}" ]; then
            echo "R2 is not configured — the GitHub artifact copy below is the backup."
            exit 0
          fi
          if ! command -v aws >/dev/null 2>&1; then
            pip install --quiet awscli
          fi
          aws s3 cp "$FILE" "s3://$R2_BUCKET/$PREFIX/$FILE" --endpoint-url "$R2_ENDPOINT"
          echo "R2_USED=yes ($R2_BUCKET)" >> "$GITHUB_ENV"

      - name: Refuse to publish a plaintext dump
        if: env.FILE != '' && env.ENCRYPTED != 'true'
        run: |
          echo "::error::BACKUP_PASSPHRASE is not set — refusing to publish a plaintext dump to the public release. Add the secret and re-run."
          exit 1

      - name: Save to dated GitHub Release (no expiry)
        if: env.FILE != '' && env.ENCRYPTED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-archive
          name: Automated database backups
          body: |
            Daily encrypted PostgreSQL dumps, newest first.

            Every file is named `anjuman-YYYYMMDD-HHMM.sql.gz.gpg`, so the
            backup date is always visible. These release assets do **not**
            expire. Restore steps: see `BACKUP.md` in the repository.
          files: ${{ env.FILE }}
          make_latest: false
          fail_on_unmatched_files: true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Nightly backup"
            echo "- File: \`${FILE:-not created}\`"
            echo "- Size: ${SIZE_KB:-?} KB"
            echo "- Encrypted: ${ENCRYPTED:-no}"
            echo "- Saved to: GitHub Release \`backup-archive\` (no expiry)"
            echo "- R2: ${R2_USED:-not configured}"
          } >> "$GITHUB_STEP_SUMMARY"
