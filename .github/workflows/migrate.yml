name: Apply SQL migration

# Applies one migration file to the live Supabase database using the
# existing SUPABASE_DB_URL secret. This replaces the old Management API
# token flow (which stopped working after the PAT was revoked).
#
# Safety:
#   - only runs on a manual dispatch, or when a migration file is pushed
#   - skips itself when the secret is missing
#   - ON_ERROR_STOP=1, so a partial migration is not silently ignored
#
# Usage: Actions → "Apply SQL migration" → Run workflow → file path.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Migration file path"
        required: true
        default: "supabase/migrations/0044_collection_date.sql"
  push:
    paths:
      - "supabase/migrations/0044_collection_date.sql"
      - "supabase/migrations/0043_reclassify_raziya_gifts.sql"
      - "supabase/migrations/0042_rebuild_raziya_monthly.sql"
      - "supabase/migrations/0041_import_raziya_manzil.sql"
      - "supabase/migrations/0040_member_pause_resume.sql"
      - "supabase/migrations/0039_restore_member.sql"
      - "supabase/migrations/0038_fix_dashboard_settled_at.sql"
      - ".github/workflows/migrate.yml"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for database URL secret
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DB_URL secret is not set — skipping migration."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Resolve IPv4 pooler connection
        if: steps.check.outputs.ready == 'true'
        env:
          RAW_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          URL="$RAW_DB_URL"
          if [[ "$URL" =~ ^postgresql://postgres:(.*)@db\.([a-z0-9]+)\.supabase\.co:5432/postgres$ ]]; then
            PASS="${BASH_REMATCH[1]}"
            REF="${BASH_REMATCH[2]}"
            if [[ "$PASS" != *"%"* ]]; then
              PASS=$(printf '%s' "$PASS" | sed -e 's/%/%25/g' -e 's/@/%40/g' -e 's/:/%3A/g' -e 's/#/%23/g' -e 's|/|%2F|g')
            fi
            URL="postgresql://postgres.${REF}:${PASS}@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require"
          fi
          echo "DB_URL_RUN=$URL" >> "$GITHUB_ENV"
          echo "Using host: $(printf '%s' "$URL" | sed -E 's#.*@([^/?]+).*#\1#')"

      - name: Apply migration
        if: steps.check.outputs.ready == 'true'
        env:
          FILE: ${{ github.event.inputs.file || 'supabase/migrations/0044_collection_date.sql' }}
        run: |
          set -euo pipefail
          test -f "$FILE"
          echo "Applying $FILE"
          psql "$DB_URL_RUN" -v ON_ERROR_STOP=1 -f "$FILE"

      - name: Verify migration result
        if: steps.check.outputs.ready == 'true'
        env:
          FILE: ${{ github.event.inputs.file || 'supabase/migrations/0044_collection_date.sql' }}
        run: |
          set -euo pipefail
          case "$FILE" in
            *0038*)
              psql "$DB_URL_RUN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_src text;
          begin
            select p.prosrc into v_src
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and p.proname = 'dashboard_snapshot'
             limit 1;

            if v_src is null then
              raise exception 'dashboard_snapshot not found';
            end if;
            -- Only reject the buggy expression, not a comment that names it.
            if v_src like '%coalesce(settled_at%' then
              raise exception 'dashboard_snapshot still references coalesce(settled_at, ...)';
            end if;
            if v_src not like '%coalesce(verified_at, created_at)%' then
              raise exception 'dashboard_snapshot is missing coalesce(verified_at, created_at)';
            end if;
          end $$;
          select 'dashboard_snapshot OK (uses verified_at)' as result;
          SQL
              ;;
            *0039*)
              psql "$DB_URL_RUN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (
              select 1
                from pg_proc p
                join pg_namespace n on n.oid = p.pronamespace
               where n.nspname = 'public'
                 and p.proname = 'restore_member'
            ) then
              raise exception 'restore_member not found';
            end if;
          end $$;
          select 'restore_member OK' as result;
          SQL
              ;;
            *0040*)
              psql "$DB_URL_RUN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (
              select 1
                from pg_enum e
                join pg_type t on t.oid = e.enumtypid
                join pg_namespace n on n.oid = t.typnamespace
               where n.nspname = 'public'
                 and t.typname = 'member_status'
                 and e.enumlabel = 'paused'
            ) then
              raise exception 'member_status is missing the paused value';
            end if;
          end $$;
          select 'member_status.paused OK' as result;
          SQL
              ;;
            *0041*)
              psql "$DB_URL_RUN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_tenant  uuid;
            v_members int;
            v_paid    bigint;
          begin
            select id into v_tenant
              from public.tenants
             where code = 'RMHC' or name ilike '%Raziya Manzil%'
             order by (code = 'RMHC') desc, created_at asc
             limit 1;

            if v_tenant is null then
              raise exception 'Raziya Manzil tenant not found';
            end if;

            select count(*) into v_members
              from public.members
             where tenant_id = v_tenant and notes like 'old-app:user:%';

            select coalesce(sum(amount_paise), 0) into v_paid
              from public.payments
             where tenant_id = v_tenant and receipt_no like 'OLD-%';

            raise notice 'Raziya import: members=%, paid_paise=%', v_members, v_paid;

            if v_members <> 37 then
              raise exception 'Expected 37 imported members, found %', v_members;
            end if;
            if v_paid <> 2510000 then
              raise exception 'Expected paid 2510000 paise, found %', v_paid;
            end if;
          end $$;
          select 'Raziya Manzil import OK' as result;
          SQL
              ;;
            *0042*)
              psql "$DB_URL_RUN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_tenant    uuid;
            v_members   int;
            v_billed    bigint;
            v_allocated bigint;
            v_open      bigint;
            v_advance   bigint;
          begin
            select id into v_tenant
              from public.tenants
             where code = 'RMHC' or name ilike '%Raziya Manzil%'
             order by (code = 'RMHC') desc, created_at asc
             limit 1;

            if v_tenant is null then
              raise exception 'Raziya Manzil tenant not found';
            end if;

            select count(*) into v_members
              from public.members
             where tenant_id = v_tenant and notes like 'old-app:user:%';

            select coalesce(sum(i.amount_paise), 0),
                   coalesce(sum(i.paid_paise), 0)
              into v_billed, v_allocated
              from public.invoices i
              join public.members m on m.id = i.member_id
             where i.tenant_id = v_tenant
               and m.notes like 'old-app:user:%'
               and i.period between '2025-12' and '2026-11';

            select coalesce(sum(i.amount_paise - i.paid_paise), 0)
              into v_open
              from public.invoices i
              join public.members m on m.id = i.member_id
             where i.tenant_id = v_tenant
               and m.notes like 'old-app:user:%'
               and i.status in ('pending','partial');

            select coalesce(sum(unallocated_paise), 0)
              into v_advance
              from public.payments
             where tenant_id = v_tenant and receipt_no like 'OLD-%';

            raise notice 'Raziya rebuild: members=%, billed=%, allocated=%, open=%, advance=%',
              v_members, v_billed, v_allocated, v_open, v_advance;

            if v_members <> 37 then
              raise exception 'Expected 37 members, found %', v_members;
            end if;
            if v_billed <> 4810000 then
              raise exception 'Expected billed 4810000 paise, found %', v_billed;
            end if;
            if v_allocated <> 2490000 then
              raise exception 'Expected allocated 2490000 paise, found %', v_allocated;
            end if;
            if v_open <> 2320000 then
              raise exception 'Expected open 2320000 paise, found %', v_open;
            end if;
            if v_advance <> 20000 then
              raise exception 'Expected advance 20000 paise, found %', v_advance;
            end if;
          end $$;
          select 'Raziya monthly rebuild OK (net due 2300000 paise)' as result;
          SQL
              ;;
            *0043*)
              psql "$DB_URL_RUN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_tenant  uuid;
            v_total   bigint;
            v_gen     bigint;
            v_gift    bigint;
            v_donated bigint;
            v_moved   int;
          begin
            select id into v_tenant
              from public.tenants
             where code = 'RMHC' or name ilike '%Raziya Manzil%'
             order by (code = 'RMHC') desc, created_at asc
             limit 1;

            if v_tenant is null then
              raise exception 'Raziya Manzil tenant not found';
            end if;

            select coalesce(sum(balance_paise), 0) into v_total
              from public.funds where tenant_id = v_tenant;
            select balance_paise into v_gen
              from public.funds where tenant_id = v_tenant and code = 'GEN';
            select balance_paise into v_gift
              from public.funds where tenant_id = v_tenant and code = 'GIFT';

            select coalesce(sum(d.amount_paise), 0), count(*)
              into v_donated, v_moved
              from public.donations d
              join public.funds f on f.id = d.fund_id
             where d.tenant_id = v_tenant
               and d.receipt_no like 'OLD-GIFT-%'
               and f.code = 'GIFT';

            raise notice 'Raziya gifts: total_funds=%, gen=%, gift=%, donation=%, rows=%',
              v_total, v_gen, v_gift, v_donated, v_moved;

            if v_total <> 2412300 then
              raise exception 'Expected total funds 2412300, found %', v_total;
            end if;
            if v_gen <> 2262300 then
              raise exception 'Expected GEN 2262300, found %', v_gen;
            end if;
            if v_gift <> 150000 then
              raise exception 'Expected GIFT 150000, found %', v_gift;
            end if;
            if v_donated <> 150000 or v_moved <> 2 then
              raise exception 'Expected 2 gifts worth 150000 in GIFT, found % rows / % paise',
                v_moved, v_donated;
            end if;
          end $$;
          select 'Raziya gifts reclassified OK' as result;
          SQL
              ;;
            *0044*)
              psql "$DB_URL_RUN" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_apply text;
            v_guard text;
          begin
            select prosrc into v_apply
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and p.proname = 'apply_verified_payment'
             limit 1;

            select prosrc into v_guard
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and p.proname = 'guard_payment_insert'
             limit 1;

            if v_apply is null or v_apply not like '%coalesce(p.created_at, now())%' then
              raise exception 'apply_verified_payment is not using the collection date';
            end if;
            if v_guard is null or v_guard not like '%Collection date future%' then
              raise exception 'guard_payment_insert is missing the future-date check';
            end if;
          end $$;
          select 'collection date logic OK' as result;
          SQL
              ;;
            *)
              echo "No extra verification for $FILE"
              ;;
          esac

      - name: Summary
        if: always()
        run: echo "Migration workflow finished at $(date -u +%H:%M:%S) UTC" >> "$GITHUB_STEP_SUMMARY"
