name = "r2-quota-checker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[build]
command = ""

[vars]
R2_BUCKET_NAME = "anjuman-assets"
WARNING_THRESHOLD = "0.95"
QUOTA_LIMIT_GB = "10"

[triggers]
crons = ["0 2 * * *"]  # Daily at 2 AM UTC

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "anjuman-assets"

[[kv_namespaces]]
binding = "R2_QUOTA_KV"
id = "ad0dc6f8f4bc44f486c53d61a0aec45d"
