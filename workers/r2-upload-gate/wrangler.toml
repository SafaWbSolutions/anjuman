name = "r2-upload-gate"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[build]
command = ""

[vars]
R2_BUCKET_NAME = "anjuman-assets"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "anjuman-assets"

[[kv_namespaces]]
binding = "R2_QUOTA_KV"
id = "<YOUR_KV_NAMESPACE_ID>"
preview_id = "<YOUR_PREVIEW_KV_ID>"